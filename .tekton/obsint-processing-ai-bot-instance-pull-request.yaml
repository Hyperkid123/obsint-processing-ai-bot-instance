apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    pipelinesascode.tekton.dev/pipeline: >-
      https://github.com/RedHatInsights/konflux-pipelines/raw/main/pipelines/docker-build.yaml
    build.appstudio.openshift.io/repo: https://github.com/RedHatInsights/obsint-processing-ai-bot-instance?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch == "master"
  labels:
    appstudio.openshift.io/application: obsint-processing-ai-bot-instance
    appstudio.openshift.io/component: obsint-processing-ai-bot-instance
    pipelines.appstudio.openshift.io/type: build
  name: obsint-processing-ai-bot-instance-on-pull-request
  namespace: obsint-processing-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/obsint-processing-tenant/obsint-processing-ai-bot-instance/obsint-processing-ai-bot-instance:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: dev-bot/Dockerfile.runner
  - name: path-context
    value: .
  # Preserve the inline pipeline's image behavior; the shared default is true.
  - name: build-source-image
    value: "false"
  # Preserve the existing scan set; the availability check still runs.
  - name: skip-sast-coverity-check
    value: "true"
  pipelineRef:
    name: docker-build
  taskRunTemplate:
    serviceAccountName: build-pipeline-obsint-processing-ai-bot-instance
  workspaces:
  - name: workspace
    volumeClaimTemplate:
      metadata: {}
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
      status: {}
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
