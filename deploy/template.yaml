apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: obsint-processing-ai-bot-instance
parameters:
- name: NAMESPACE
  value: ${NAMESPACE}
- name: BOT_IMAGE
  value: quay.io/redhat-services-prod/obsint-processing-tenant/obsint-processing-ai-bot-instance
- name: IMAGE_TAG
  required: true
- name: BOT_LABEL
  value: obsint-processing-ai
- name: BOT_REPLICAS
  value: "0"
- name: BOT_BOARD_NAME
  value: "CCX Core - Processing"
- name: BOT_SPRINT_PREFIX
  value: "CCXDEV Sprint"
- name: BOT_INCLUDE_BACKLOG
  value: "false"
- name: BOT_INSTANCE_ID
  value: ""
- name: BOT_CONFIG_REPO
  value: ""
- name: BOT_NAME
  value: devbot-obsint-processing
- name: PROXY_NAME
  description: Proxy Service and pod label in the same namespace
  value: devbot-proxy
- name: GIT_AUTH_PROXY_HOST
  description: Set to PROXY_NAME only after enabling Git auth on that proxy
  value: ""
- name: BOT_CONFIG_PATH
  value: ""
- name: GCP_PROJECT_ID
  required: true
- name: GCP_REGION
  required: true
- name: VERTEX_ALLOWED_MODELS
  required: true
- name: BOT_EXECUTION_ENGINE
  value: coordinator
- name: REHOR_WORKSPACE_OWNER_UID
  description: Numeric UID owning /home/botuser/app in the image; the coordinator compares the workspace owner against it instead of the pod's runtime UID.
  value: "1000"
- name: SLACK_WEBHOOK_URL
  value: ""
- name: WEEKLY_STATUS_SLACK_WEBHOOK_URL
  description: Optional override used by WatchDuty's weekly-status watcher; set to the CVE/status-channel webhook when different from the Jenkins/watchduty webhook.
  value: ""
- name: KEDA_TIMEZONE
  value: "Europe/Prague"
- name: KEDA_CRON_START
  value: "0 8 * * 1-5"
- name: KEDA_CRON_END
  value: "0 16 * * 1-5"
objects:

# ============================================================================
# Bot-only deployment for obsint-processing-ai-bot-instance runner instance.
#
# PROXY_NAME defaults to the existing shared proxy; bot secrets stay shared.
# To use the team proxy, deploy proxy-template.yaml once, then update all bot
# targets in app-interface after verifying the proxy is ready.
# The devbot-memory-server Service remains shared in the same namespace.
# ============================================================================

# --- Bot Deployment ---
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: ${BOT_NAME}
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/component: bot
      app.kubernetes.io/part-of: devbot
  spec:
    replicas: ${{BOT_REPLICAS}}
    selector:
      matchLabels:
        app.kubernetes.io/name: ${BOT_NAME}
    template:
      metadata:
        labels:
          app.kubernetes.io/name: ${BOT_NAME}
          app.kubernetes.io/component: bot
          devbot-proxy-client: ${PROXY_NAME}
          app.kubernetes.io/part-of: devbot
      spec:
        containers:
        - name: bot
          image: ${BOT_IMAGE}:${IMAGE_TAG}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
          - name: BOT_LABEL
            value: ${BOT_LABEL}
          - name: BOT_MEMORY_URL
            value: http://devbot-memory-server:8080/mcp
          - name: BOT_MEMORY_HEALTH_URL
            value: http://devbot-memory-server:8080/health
          - name: BOT_MEMORY_HEALTH_TIMEOUT
            value: "120"
          # OpenCode V2 — each profile selects its provider and baked deployment config.
          - name: BOT_EXECUTION_ENGINE
            value: ${BOT_EXECUTION_ENGINE}
          - name: REHOR_OPENCODE_DEPLOYMENT_CONFIG
            value: /home/botuser/app/${BOT_CONFIG_PATH}/opencode-deployment.json
          - name: REHOR_WORKSPACE_OWNER_UID
            value: ${REHOR_WORKSPACE_OWNER_UID}
          - name: REHOR_VERTEX_PROXY_URL
            value: http://${PROXY_NAME}:8443
          - name: VERTEX_ALLOWED_MODELS
            value: ${VERTEX_ALLOWED_MODELS}
          - name: REHOR_MODEL_PROXY_URL
            value: http://${PROXY_NAME}:8450/v1
          # Non-secret client placeholder; upstream model credentials stay in the proxy.
          - name: REHOR_MODEL_PROXY_TOKEN
            value: rehor-runtime
          # Executor — thin client connects to proxy over TCP
          # GlitchTip helpers also derive this host's port 8448 from EXECUTOR_ADDR.
          - name: EXECUTOR_ADDR
            value: ${PROXY_NAME}:9090
          # Git auth reverse proxy is opt-in during migration.
          - name: GIT_AUTH_PROXY_HOST
            value: ${GIT_AUTH_PROXY_HOST}
          # Git identity — per-platform (from the existing shared Vault Secret)
          - name: GH_USER_NAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gh-username
          - name: GH_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-email
          - name: GL_USER_NAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gl-name
          - name: GL_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gl-email
          # Jira identity (must match the selected proxy credentials)
          - name: BOT_JIRA_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: jira-email
          # Bot config
          - name: BOT_BOARD_NAME
            value: ${BOT_BOARD_NAME}
          - name: BOT_SPRINT_PREFIX
            value: ${BOT_SPRINT_PREFIX}
          - name: BOT_INCLUDE_BACKLOG
            value: ${BOT_INCLUDE_BACKLOG}
          - name: BOT_INSTANCE_ID
            value: ${BOT_INSTANCE_ID}
          - name: BOT_CONFIG_REPO
            value: ${BOT_CONFIG_REPO}
          - name: BOT_CONFIG_PATH
            value: ${BOT_CONFIG_PATH}
          - name: BOT_DASHBOARD_URL
            value: http://devbot-memory-server:8080/api/bot-status
          - name: COSTS_API_URL
            value: http://devbot-memory-server:8080/api/costs
          # One configured Slack destination per bot; developer-bot shares its app webhook.
          - name: SLACK_WEBHOOK_URL
            value: ${SLACK_WEBHOOK_URL}
          # Optional CVE/status-channel destination for WatchDuty's weekly status watcher.
          - name: WEEKLY_STATUS_SLACK_WEBHOOK_URL
            value: ${WEEKLY_STATUS_SLACK_WEBHOOK_URL}
          # Proxy — Service selected by PROXY_NAME
          - name: PROXY_HOST
            value: ${PROXY_NAME}
          - name: HTTP_PROXY
            value: http://${PROXY_NAME}:3128
          - name: HTTPS_PROXY
            value: http://${PROXY_NAME}:3128
          - name: http_proxy
            value: http://${PROXY_NAME}:3128
          - name: https_proxy
            value: http://${PROXY_NAME}:3128
          - name: NO_PROXY
            value: devbot-memory-server,${PROXY_NAME},localhost,127.0.0.1
          - name: no_proxy
            value: devbot-memory-server,${PROXY_NAME},localhost,127.0.0.1
          # Jira — proxied through proxy container (mcp-atlassian on port 8444)
          - name: JIRA_MCP_URL
            value: http://${PROXY_NAME}:8444/mcp
          # GH release upload — proxied through proxy container (port 8446)
          - name: GH_RELEASE_UPLOAD_URL
            value: http://${PROXY_NAME}:8446/upload
          # Secrets that stay in bot container (SSO for E2E)
          - name: SSO_USERNAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: e2e-username
          - name: SSO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: e2e-password
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 8Gi

# --- NetworkPolicy: Bot can only reach proxy + memory-server ---
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: ${BOT_NAME}-egress
    labels:
      app.kubernetes.io/part-of: devbot
  spec:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ${BOT_NAME}
    policyTypes:
    - Egress
    egress:
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: ${PROXY_NAME}
      ports:
      - port: 3128
        protocol: TCP
      - port: 9090
        protocol: TCP
      - port: 8443
        protocol: TCP
      - port: 8444
        protocol: TCP
      - port: 8446
        protocol: TCP
      - port: 8447
        protocol: TCP
      - port: 8448
        protocol: TCP
      - port: 8450
        protocol: TCP
      - port: 8451
        protocol: TCP
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: memory-server
      ports:
      - port: 8080
        protocol: TCP
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-dns
      ports:
      - port: 5353
        protocol: UDP
      - port: 5353
        protocol: TCP

# --- KEDA Cron Scaler ---
# Defaults match Ctibor's schedule (Mon-Fri 08:00-16:00 Prague).
# Override KEDA_TIMEZONE, KEDA_CRON_START, KEDA_CRON_END per deployment
# target in the app-interface SaaS file.
- apiVersion: keda.sh/v1alpha1
  kind: ScaledObject
  metadata:
    name: ${BOT_NAME}-cron-scaler
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/part-of: devbot
  spec:
    scaleTargetRef:
      name: ${BOT_NAME}
    minReplicaCount: 0
    maxReplicaCount: 1
    triggers:
    - type: cron
      metadata:
        timezone: ${KEDA_TIMEZONE}
        start: ${KEDA_CRON_START}
        end: ${KEDA_CRON_END}
        desiredReplicas: "1"
