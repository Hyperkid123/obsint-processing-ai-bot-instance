workflow: ./workflows/watchduty
source: scheduled
runtime: opencode
provider: rehor-openai
model: gpt-6.1-sol
envs:
  - slack
# Sandbox image launched by the agent dispatcher for this profile.
image:
  repository: quay.io/redhat-services-prod/obsint-processing-tenant/obsint-processing-ai-bot-instance/obsint-processing-ai-bot-instance
  # Newest promoted Konflux build of main.
  tag: latest
# Non-secret profile settings for dispatcher wiring and the sandbox runner.
env:
  BOT_INSTANCE_ID: Jeho Jasnost, Kníže Spytihněv I., Ochránce Produkčního Míru
  BOT_LABEL: obsint-watchduty
  BOT_CONFIG_PATH: instance/watchduty
  BOT_EXECUTION_ENGINE: coordinator
# Declarative preflights (REHOR-231): the complete set for this instance,
# executed by the dispatcher's TS engine (@rehor/preflights) instead of the
# workflow's Python set. Jenkins endpoints, Slack webhooks, and persistent
# state come from dispatcher deployment wiring, not this file.
preflights:
  - obsint-jenkins-status
  - obsint-mintmaker-prs
  - obsint-weekly-status-update
# Legacy KEDA window of devbot-obsint-watchduty (app-interface obsint-deploy):
# the dispatcher starts no sessions outside it; in-flight sessions drain.
schedule:
  triggers:
    - timezone: Europe/Prague
      start: "0 8 * * 1-5"
      end: "0 16 * * 1-5"
